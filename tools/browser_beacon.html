<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser Beacon</title>
<style>
  :root { --bg: #f5f7fa; --fg: #14202b; --muted: #5b6875; --accent: #1c5ca8; --splash: #ffa028; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15191e; --fg: #e8edf2; --muted: #9aa7b3; --accent: #6aa8f0; } }
  body { margin: 0; font: 16px/1.5 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); transition: background .2s; }
  body.splash { background: var(--splash); color: #14202b; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  body.splash .muted { color: #14202b; }
  button { font: inherit; padding: 8px 16px; margin: 12px 8px 0 0; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  #status { font-size: 20px; font-weight: 600; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1 id="name">Browser Beacon</h1>
  <p class="muted">Test page for Sound Tracker's Window Alerts. Plays a quiet "cast" and, a few seconds later, a loud "splash", like fishing in a game. Open it in several separate browser instances (see docs/TESTING.md).</p>
  <button id="cast">Cast (Space)</button>
  <button id="auto" class="secondary">Auto: off</button>
  <div id="status">Click Cast to start (browsers block sound until you click once)</div>
  <p id="stats" class="muted"></p>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const name = params.get("name") || "Browser Beacon";
  document.getElementById("name").textContent = name;
  document.title = name;

  let ctx = null, waiting = false, auto = false, casts = 0, splashes = 0, lastSplash = "-", timer = null;
  const status = document.getElementById("status");
  const stats = document.getElementById("stats");

  function now() { return new Date().toLocaleTimeString([], { hour12: false }) + "." + String(Date.now() % 1000).padStart(3, "0"); }
  function render() { stats.textContent = `Casts: ${casts}   Splashes: ${splashes}   Last splash: ${lastSplash}`; }

  function tone(volume, seconds, makeSample) {
    ctx = ctx || new AudioContext();
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * seconds), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = volume * makeSample(i / ctx.sampleRate, i / data.length);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    source.start();
  }

  function cast() {
    if (waiting) return;
    let phase = 0;
    tone(0.05, 0.45, (t, p) => { phase += 2 * Math.PI * (900 - 600 * p) / ctx.sampleRate; return Math.sin(Math.PI * p) * Math.sin(phase); });
    casts++; waiting = true;
    status.textContent = "Line in the water... waiting for a bite";
    document.body.classList.remove("splash");
    timer = setTimeout(splash, 3000 + Math.random() * 9000);
    render();
  }

  function splash() {
    let low = 0;
    tone(0.3, 0.8, t => { low = low * 0.6 + (Math.random() * 2 - 1) * 0.4; return Math.min(1, Math.max(-1, low * 2.2)) * (t < 0.01 ? t / 0.01 : 1) * Math.exp(-t * 4); });
    splashes++; waiting = false; lastSplash = now();
    status.textContent = "SPLASH! at " + lastSplash;
    document.title = "SPLASH " + name;
    document.body.classList.add("splash");
    setTimeout(() => { document.body.classList.remove("splash"); document.title = name; }, 1500);
    if (auto) timer = setTimeout(cast, 1500 + Math.random() * 1500);
    render();
  }

  document.getElementById("cast").onclick = cast;
  document.getElementById("auto").onclick = e => {
    auto = !auto;
    e.target.textContent = "Auto: " + (auto ? "on" : "off");
    if (auto && !waiting) cast();
  };
  document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); cast(); } });
  render();
</script>
</body>
</html>
