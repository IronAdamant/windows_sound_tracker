name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: SoundTracker-${{ github.sha }}
          path: |
            build/bin/Release/SoundTracker.exe
            build/bin/Release/SoundBeacon.exe
            tools/launch_beacons.ps1

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item tools/launch_beacons.ps1 build/bin/Release/
          Compress-Archive -Path build/bin/Release/SoundTracker.exe, build/bin/Release/SoundBeacon.exe, build/bin/Release/launch_beacons.ps1 -DestinationPath SoundTracker-${{ github.ref_name }}.zip
          gh release create ${{ github.ref_name }} build/bin/Release/SoundTracker.exe SoundTracker-${{ github.ref_name }}.zip --generate-notes
